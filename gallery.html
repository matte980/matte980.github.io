    const params = new URLSearchParams(window.location.search);
    const hashRoute = window.location.hash.replace(/^#\/?/, '');
    const hashParts = hashRoute.split('/').filter(Boolean);

    let parsedSlug = '';

    if (hashParts.length >= 2) {
      parsedSection = hashParts[0].toLowerCase();
      parsedSlug = hashParts[1].toLowerCase();
    } else {
      parsedSection = (params.get('section') || 'personal').toLowerCase();
      parsedSlug = (params.get('slug') || '').toLowerCase();
    }

    const section = CATALOG[parsedSection] ? parsedSection : 'personal';
    const sectionConfig = CATALOG[section];
    const defaultProjectSlug = Object.keys(sectionConfig.projects)[0];
    const slug = sectionConfig.projects[parsedSlug] ? parsedSlug : defaultProjectSlug;
    const project = sectionConfig.projects[slug];

    const canonicalHash = '#' + section + '/' + slug;
    if (window.location.hash !== canonicalHash || window.location.search) {
      history.replaceState(null, '', window.location.pathname + canonicalHash);
    }

    document.title = project.pageTitle + ' | Matteo Monzali';

    function absoluteUrl(path) {
      return new URL(path.replace(/^\//, ''), 'https://matteomonzali.com/').toString();
    }

    function setMeta(id, value) {
      const el = document.getElementById(id);
      if (el) el.setAttribute('content', value);
    }

    function setCanonical(value) {
      const el = document.getElementById('meta-canonical');
      if (el) el.setAttribute('href', value);
    }

    function updateSeoMeta(p) {
      const title = p.pageTitle + ' | Matteo Monzali';
      const sectionDescriptions = {
        personal: 'Personal documentary and environmental photography by Matteo Monzali.',
        work: 'Commissioned science and documentary photography by Matteo Monzali.',
        research: 'Research-driven and experimental visual projects by Matteo Monzali.'
      };
      const description = p.pageTitle + ' - ' + (sectionDescriptions[section] || 'Photography project by Matteo Monzali.');
      const preview = resolveCandidates(p)[0];
      const fallbackUrl = absoluteUrl(window.location.pathname.replace(/^\//, ''));
      const pageUrl = window.location.hash ? fallbackUrl + window.location.hash : fallbackUrl;
      const previewUrl = preview ? absoluteUrl(preview.src) : absoluteUrl('images/Res/DescriptionImage.jpg');

      setCanonical(fallbackUrl);
      setMeta('meta-description', description);
      setMeta('meta-og-title', title);
      setMeta('meta-og-description', description);
      setMeta('meta-og-url', pageUrl);
      setMeta('meta-og-image', previewUrl);
      setMeta('meta-twitter-title', title);
      setMeta('meta-twitter-description', description);
      setMeta('meta-twitter-image', previewUrl);
    }

    updateSeoMeta(project);

    const leftNavLink = document.querySelector('.gallery-nav-link--left');
    leftNavLink.href = sectionConfig.indexPage;
    leftNavLink.setAttribute('data-site-label', section);
    leftNavLink.setAttribute('data-site-label-prefix', '←\u00A0');
    if (typeof window.applySiteLabels === 'function') {
      window.applySiteLabels();
    } else {
      leftNavLink.innerHTML = '←\u00A0' + sectionConfig.indexLabel;
    }

    const slideshowEl = document.getElementById('slideshow');
    const cursorCounterEl = document.getElementById('cursorCounter');

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function resolveCandidates(p) {
      const imageBasePath = p.basePath || ('images/' + section + '/' + p.folder);

      if (Array.isArray(p.files) && p.files.length > 0) {
        return p.files.map(function(name, idx) {
          return {
            src: imageBasePath + '/' + name,
            alt: p.altLabel + ' ' + (idx + 1)
          };
        });
      }

      const sequence = Array.isArray(p.available) && p.available.length > 0
        ? p.available
        : Array.from({ length: p.count }, function(_, idx) { return idx + 1; });

      return sequence.map(function(n) {
        const formattedIndex = typeof p.zeroPad === 'number' && p.zeroPad > 0
          ? String(n).padStart(p.zeroPad, '0')
          : String(n);
        return {
          src: imageBasePath + '/' + p.prefix + formattedIndex + '.jpg',
          alt: p.altLabel + ' ' + n
        };
      });
    }

    function checkImageExists(candidate) {
      return new Promise(function(resolve) {
        const probe = new Image();
        probe.onload = function() {
          resolve(candidate);
        };
        probe.onerror = function() {
          resolve(null);
        };
        probe.src = candidate.src;
      });
    }

    function resolveIntroText(p, imageBasePath) {
      const fallbackText = typeof p.introText === 'string' ? p.introText.trim() : '';
      const explicitPath = typeof p.introTextPath === 'string' ? p.introTextPath.trim() : '';
      const introFileName = typeof p.introTextFile === 'string' ? p.introTextFile.trim() : '';
      if (!explicitPath && (!introFileName)) {
        return Promise.resolve(fallbackText);
      }

      const introFilePath = explicitPath || (imageBasePath + '/' + introFileName);
      return fetch(introFilePath, { cache: 'no-store' })
        .then(function(response) {
          if (!response.ok) return fallbackText;
          return response.text().then(function(content) {
            const normalized = content.trim();
            return normalized || fallbackText;
          });
        })
        .catch(function() {
          return fallbackText;
        });
    }

    function parseIntroTextContent(rawText) {
      const normalized = typeof rawText === 'string' ? rawText.replace(/\r\n/g, '\n').trim() : '';
      if (!normalized) {
        return { subtitle: '', text: '' };
      }

      const paragraphs = normalized
        .split(/\n\s*\n/)
        .map(function(paragraph) {
          return paragraph.replace(/\s+/g, ' ').trim();
        })
        .filter(function(paragraph) {
          return paragraph.length > 0;
        });

      if (paragraphs.length <= 1) {
        return { subtitle: '', text: paragraphs[0] || '' };
      }

      return {
        subtitle: paragraphs[0],
        text: paragraphs.slice(1).join('\n\n')
      };
    }

    function renderIntroSlide(labelValue, textValue, backgroundSrc) {
      if (!textValue) return '';

      const parsed = parseIntroTextContent(textValue);
      const label = escapeHtml(labelValue || 'Picture 0');
      const subtitleMarkup = parsed.subtitle
        ? '<p class="intro-slide-subtitle">' + escapeHtml(parsed.subtitle) + '</p>'
        : '';
      const textMarkup = parsed.text
        ? '<p class="intro-slide-text">' + escapeHtml(parsed.text) + '</p>'
        : '';
      const bgLayer = backgroundSrc
        ? '<div class="intro-slide-bg" aria-hidden="true"><img src="' + backgroundSrc + '" alt=""></div>'
        : '';
      return '<div class="slide slide--intro active" data-intro-slide="true">'
        + bgLayer
        + '<div class="intro-slide-content">'
        + '<p class="intro-slide-label">' + label + '</p>'
        + subtitleMarkup
        + textMarkup
        + '</div>'
        + '</div>';
    }

    function buildSlides(p) {
      const fragments = [
        '<div class="nav-zone nav-left" id="prevZone" aria-label="Previous picture"></div>',
        '<div class="nav-zone nav-right" id="nextZone" aria-label="Next picture"></div>'
      ];

      const imageBasePath = p.basePath || ('images/' + section + '/' + p.folder);
      const candidates = resolveCandidates(p);
      return Promise.all([
        Promise.all(candidates.map(checkImageExists)),
        resolveIntroText(p, imageBasePath)
      ]).then(function(results) {
        const existing = results[0];
        const resolvedIntroText = results[1];
        const validImages = existing.filter(function(item) { return item !== null; });
        const introBackgroundSrc = validImages.length > 0 ? validImages[0].src : '';
        const introSlideMarkup = renderIntroSlide(p.introLabel, resolvedIntroText, introBackgroundSrc);
        const hasIntro = introSlideMarkup !== '';

        if (validImages.length === 0 && !hasIntro) {
          slideshowEl.innerHTML = '<div class="slide active"><p>No images found.</p></div>';
          return { validImagesCount: 0, hasIntro: false };
        }

        if (hasIntro) {
          fragments.push(introSlideMarkup);
        }

        validImages.forEach(function(image, idx) {
          const isActive = !hasIntro && idx === 0 ? ' active' : '';
          fragments.push(
            '<div class="slide' + isActive + '"><img src="' + image.src + '" alt="' + image.alt + '"></div>'
          );
        });

        slideshowEl.innerHTML = fragments.join('');
        return {
          validImagesCount: validImages.length,
          hasIntro: hasIntro
        };
      });
    }

    let slides = [];
    let index = 0;
    let hasIntroSlide = false;
    let totalImagesCount = 0;
    let cursorPointsRight = true;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let contrastUpdatePending = false;

    const colorProbeCanvas = document.createElement('canvas');
    colorProbeCanvas.width = 1;
    colorProbeCanvas.height = 1;
    const colorProbeCtx = colorProbeCanvas.getContext('2d', { willReadFrequently: true });

    function toLinearChannel(channel) {
      const v = channel / 255;
      return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }

    function relativeLuminance(r, g, b) {
      return 0.2126 * toLinearChannel(r)
        + 0.7152 * toLinearChannel(g)
        + 0.0722 * toLinearChannel(b);
    }

    function parseRgbString(rgbText) {
      const match = rgbText && rgbText.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
      if (!match) return null;
      return [Number(match[1]), Number(match[2]), Number(match[3])];
    }

    function applyCounterContrastByLuminance(luminance) {
      // Use light text on dark surfaces, dark text on light surfaces.
      const useLightText = luminance < 0.42;
      cursorCounterEl.classList.toggle('is-on-image', useLightText);
    }

    function updateCounterContrast(x, y) {
      if (!cursorCounterEl) return;

      const activeSlide = slides[index];
      const activeImage = activeSlide ? activeSlide.querySelector('img') : null;
      const imageRect = activeImage ? activeImage.getBoundingClientRect() : null;
      const isOnImage = !!imageRect
        && x >= imageRect.left
        && x <= imageRect.right
        && y >= imageRect.top
        && y <= imageRect.bottom;

      if (!isOnImage || !activeImage || !colorProbeCtx) {
        const bg = parseRgbString(getComputedStyle(slideshowEl).backgroundColor) || [240, 238, 235];
        applyCounterContrastByLuminance(relativeLuminance(bg[0], bg[1], bg[2]));
        return;
      }

      const nx = (x - imageRect.left) / Math.max(imageRect.width, 1);
      const ny = (y - imageRect.top) / Math.max(imageRect.height, 1);
      const sx = Math.min(Math.max(Math.floor(nx * activeImage.naturalWidth), 0), Math.max(activeImage.naturalWidth - 1, 0));
      const sy = Math.min(Math.max(Math.floor(ny * activeImage.naturalHeight), 0), Math.max(activeImage.naturalHeight - 1, 0));

      try {
        colorProbeCtx.clearRect(0, 0, 1, 1);
        colorProbeCtx.drawImage(activeImage, sx, sy, 1, 1, 0, 0, 1, 1);
        const pixel = colorProbeCtx.getImageData(0, 0, 1, 1).data;
        applyCounterContrastByLuminance(relativeLuminance(pixel[0], pixel[1], pixel[2]));
      } catch (_) {
        // Fallback for any canvas/image read issue.
        applyCounterContrastByLuminance(1);
      }
    }

    function scheduleContrastUpdate(x, y) {
      lastPointerX = x;
      lastPointerY = y;
      if (contrastUpdatePending) return;
      contrastUpdatePending = true;

      requestAnimationFrame(function() {
        contrastUpdatePending = false;
        updateCounterContrast(lastPointerX, lastPointerY);
      });
    }

    function getCounterValue(currentIndex) {
      return hasIntroSlide ? String(currentIndex) : String(currentIndex + 1);
    }

    function updateCursorCounterText() {
      if (!cursorCounterEl) return;
      const value = getCounterValue(index) + '/' + totalImagesCount;
      cursorCounterEl.innerHTML = ''
        + '<span class="cursor-arrow cursor-arrow--left" aria-hidden="true">\u2190</span>'
        + '<span class="cursor-counter-value">' + value + '</span>'
        + '<span class="cursor-arrow cursor-arrow--right" aria-hidden="true">\u2192</span>';
      cursorCounterEl.classList.toggle('is-right', cursorPointsRight);
      cursorCounterEl.classList.toggle('is-left', !cursorPointsRight);
    }

    function positionCursorCounter(event) {
      if (!cursorCounterEl || slides.length === 0) return;

      const rect = slideshowEl.getBoundingClientRect();
      const x = event.clientX;
      const y = event.clientY;
      const isOnRightHalf = x >= (rect.left + rect.width / 2);
      cursorPointsRight = isOnRightHalf;

      cursorCounterEl.style.left = x + 'px';
      cursorCounterEl.style.top = y + 'px';
      updateCursorCounterText();
      scheduleContrastUpdate(x, y);
      cursorCounterEl.classList.add('is-visible');
    }

    function goTo(n) {
      if (slides.length <= 1) return;
      slides[index].classList.remove('active');
      index = (n + slides.length) % slides.length;
      slides[index].classList.add('active');
      updateCursorCounterText();
      if (cursorCounterEl && cursorCounterEl.classList.contains('is-visible')) {
        scheduleContrastUpdate(lastPointerX, lastPointerY);
      }
    }

    function goBackToSection() {
      window.navigateWithFade(sectionConfig.indexPage);
    }

    let suppressClickUntil = 0;

    slideshowEl.addEventListener('click', function(e) {
      if (Date.now() < suppressClickUntil) {
        e.preventDefault();
        return;
      }

      if (slides.length <= 1) return;
      const rect = this.getBoundingClientRect();
      const half = rect.left + rect.width / 2;
      if (e.clientX > half) goTo(index + 1);
      else goTo(index - 1);
    });

    slideshowEl.addEventListener('mousemove', function(e) {
      positionCursorCounter(e);
    });

    slideshowEl.addEventListener('mouseenter', function(e) {
      positionCursorCounter(e);
    });

    slideshowEl.addEventListener('mouseleave', function() {
      if (!cursorCounterEl) return;
      cursorCounterEl.classList.remove('is-visible');
    });

    document.addEventListener('keydown', function(e) {
      if (slides.length > 1 && e.key === 'ArrowRight') goTo(index + 1);
      if (slides.length > 1 && e.key === 'ArrowLeft') goTo(index - 1);
      if (e.key === 'Escape') {
        e.preventDefault();
        goBackToSection();
      }
    });

    let wheelDeltaSum = 0;
    let lastWheelNavAt = 0;
    const WHEEL_THRESHOLD = 55;
    const WHEEL_COOLDOWN_MS = 600;

    let touchStartX = 0;
    let touchStartY = 0;
    let touchLastX = 0;
    let touchLastY = 0;
    let touchStartAt = 0;
    let isTouchTracking = false;

    const SWIPE_MIN_X = 42;
    const SWIPE_MAX_Y = 70;
    const SWIPE_AXIS_RATIO = 1.25;
    const SWIPE_MAX_MS = 700;

    slideshowEl.addEventListener('wheel', function(e) {
      // On macOS trackpad, pinch zoom emits wheel events with ctrlKey=true.
      // Ignore them so zoom gestures do not change slide.
      if (e.ctrlKey) return;

      const now = Date.now();
      if (now - lastWheelNavAt < WHEEL_COOLDOWN_MS) return;

      const absX = Math.abs(e.deltaX);
      const absY = Math.abs(e.deltaY);
      const mainDelta = absX > absY ? e.deltaX : e.deltaY;

      wheelDeltaSum += mainDelta;
      if (Math.abs(wheelDeltaSum) < WHEEL_THRESHOLD) return;

      if (slides.length > 1) {
        if (wheelDeltaSum > 0) goTo(index + 1);
        else goTo(index - 1);
      }

      wheelDeltaSum = 0;
      lastWheelNavAt = now;
      e.preventDefault();
    }, { passive: false });

    slideshowEl.addEventListener('touchstart', function(e) {
      if (slides.length <= 1) return;
      if (!e.touches || e.touches.length !== 1) return;

      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchLastX = touch.clientX;
      touchLastY = touch.clientY;
      touchStartAt = Date.now();
      isTouchTracking = true;
    }, { passive: true });

    slideshowEl.addEventListener('touchmove', function(e) {
      if (!isTouchTracking) return;
      if (!e.touches || e.touches.length !== 1) return;

      touchLastX = e.touches[0].clientX;
      touchLastY = e.touches[0].clientY;
    }, { passive: true });

    slideshowEl.addEventListener('touchend', function(e) {
      if (!isTouchTracking) return;
      isTouchTracking = false;

      const endedTouch = e.changedTouches && e.changedTouches[0];
      const endX = endedTouch ? endedTouch.clientX : touchLastX;
      const endY = endedTouch ? endedTouch.clientY : touchLastY;
      const dx = endX - touchStartX;
      const dy = endY - touchStartY;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      const elapsed = Date.now() - touchStartAt;

      const isHorizontalSwipe = elapsed <= SWIPE_MAX_MS
        && absX >= SWIPE_MIN_X
        && absY <= SWIPE_MAX_Y
        && absX > absY * SWIPE_AXIS_RATIO;

      if (!isHorizontalSwipe) return;

      if (dx < 0) goTo(index + 1);
      else goTo(index - 1);

      suppressClickUntil = Date.now() + 450;
      e.preventDefault();
    }, { passive: false });

    slideshowEl.addEventListener('touchcancel', function() {
      isTouchTracking = false;
    });

    buildSlides(project).then(function(slideshowState) {
      slides = Array.from(document.querySelectorAll('.slide'));
      hasIntroSlide = slideshowState.hasIntro;
      totalImagesCount = slideshowState.validImagesCount;
      updateCursorCounterText();

      if (slides.length === 0) {
        if (cursorCounterEl) cursorCounterEl.classList.remove('is-visible');
        return;
      }

      const prevZone = document.getElementById('prevZone');
      const nextZone = document.getElementById('nextZone');

      if (prevZone) {
        prevZone.addEventListener('click', function(e) {
          e.stopPropagation();
          goTo(index - 1);
        });
      }

      if (nextZone) {
        nextZone.addEventListener('click', function(e) {
          e.stopPropagation();
          goTo(index + 1);
        });
      }
    });
  </script>

</body>
</html>
