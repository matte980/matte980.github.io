<body>

  <div class="gallery-frame work-frame">
    <div class="gallery-header">
      <a class="gallery-nav-link gallery-nav-link--left" href="../">←&nbsp;Home</a>
      <h1 class="gallery-title" data-site-label="research"></h1>
      <div class="gallery-nav-combo gallery-nav-link--right">
        <a class="gallery-nav-link" href="../science/" data-site-label="work"></a>
        <span class="gallery-nav-separator" aria-hidden="true">&nbsp;&mdash;&nbsp;</span>
        <a class="gallery-nav-link" href="../bio/">Bio</a>
      </div>
    </div>

    <div class="gallery-grid gallery-grid--scattered gallery-grid--research">
      <div class="gallery-item-wrapper">
        <div class="gallery-item gallery-item--text" aria-label="Found Archives intro">
          <span class="science-text-card-copy">Introductive text</span>
        </div>
      </div>
      <div class="gallery-item-wrapper">
        <a class="gallery-item" href="../gallery.html#research/stars">
          <img src="../images/AI/Stars/Stars1.png" alt="Stars">
          <span class="item-title">STARS</span>
        </a>
      </div>
      <div class="gallery-item-wrapper">
        <a class="gallery-item" href="../gallery.html#research/arctic">
          <img src="../images/AI/Arctic/Arctic1.png" alt="Arctic">
          <span class="item-title">ARCTIC</span>
        </a>
      </div>
    </div>

  </div>

  <script>
    function renderStructuredTextCard(element, rawText) {
      if (!element || typeof rawText !== 'string') return;

      const normalized = rawText.replace(/\r\n/g, '\n').trim();
      if (!normalized) return;

      const paragraphs = normalized
        .split(/\n\s*\n/)
        .map(function(paragraph) {
          return paragraph.replace(/\s+/g, ' ').trim();
        })
        .filter(function(paragraph) {
          return paragraph.length > 0;
        });

      if (paragraphs.length === 0) return;

      const subtitle = paragraphs.length > 1 ? '<span class="science-text-card-subtitle">' + paragraphs[0].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span>' : '';
      const body = '<span class="science-text-card-text">' + (paragraphs.length > 1 ? paragraphs.slice(1).join('\n\n') : paragraphs[0]).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n\n/g, '<br><br>') + '</span>';
      element.innerHTML = subtitle + body;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const foundArchivesNoteEl = document.querySelector('.gallery-item--text .science-text-card-copy');
      if (foundArchivesNoteEl) {
        fetch('../images/Intro/IntroFoundArchives.txt', { cache: 'no-store' })
          .then(function(response) {
            if (!response.ok) return null;
            return response.text();
          })
          .then(function(content) {
            renderStructuredTextCard(foundArchivesNoteEl, content || '');
          })
          .catch(function() {
            // Keep fallback text already present in the markup.
          });
      }

      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        e.preventDefault();
        window.navigateWithFade('../');
      });
    });
  </script>

</body>
</html>
