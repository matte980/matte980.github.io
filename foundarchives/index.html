<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-site-title="research" data-site-title-suffix=" | Matteo Monzali"></title>
<meta name="description" content="Progetti di ricerca fotografica e collaborazioni di Matteo Monzali.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://matte980.github.io/foundarchives/">
<meta property="og:locale" content="it_IT">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Matteo Monzali">
<meta property="og:title" content="Found Archives | Matteo Monzali">
<meta property="og:description" content="Progetti di ricerca fotografica e collaborazioni di Matteo Monzali.">
<meta property="og:url" content="https://matte980.github.io/foundarchives/">
<meta property="og:image" content="https://matte980.github.io/images/work/PASTURS/PASTURS1-og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Found Archives | Matteo Monzali">
<meta name="twitter:description" content="Progetti di ricerca fotografica e collaborazioni di Matteo Monzali.">
<meta name="twitter:image" content="https://matte980.github.io/images/work/PASTURS/PASTURS1-og.jpg">
<link rel="icon" type="image/png" href="/images/Res/website-icon.png">
<link rel="stylesheet" href="/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<script src="/site-data.js"></script>
</head>
<body>

  <div class="gallery-frame work-frame">
    <div class="gallery-header">
      <a class="gallery-nav-link gallery-nav-link--left" href="/">←&nbsp;Home</a>
      <h1 class="gallery-title" data-site-label="research"></h1>
      <div class="gallery-nav-combo gallery-nav-link--right">
        <a class="gallery-nav-link" href="/science/" data-site-label="work"></a>
        <span class="gallery-nav-separator" aria-hidden="true">&nbsp;&mdash;&nbsp;</span>
        <a class="gallery-nav-link" href="/bio/">Bio</a>
      </div>
    </div>

    <div class="gallery-grid gallery-grid--scattered gallery-grid--research">
      <div class="gallery-item-wrapper">
        <div class="gallery-item gallery-item--text" aria-label="Found Archives intro">
          <span class="science-text-card-copy">Testo introduttivo</span>
        </div>
      </div>
      <div class="gallery-item-wrapper">
        <a class="gallery-item" href="/gallery.html#research/stars">
          <img src="/images/AI/Stars/Stars1.png" alt="Stars">
          <span class="item-title">STARS</span>
        </a>
      </div>
      <div class="gallery-item-wrapper">
        <a class="gallery-item" href="/gallery.html#research/arctic">
          <img src="/images/AI/Arctic/Arctic1.png" alt="Arctic">
          <span class="item-title">ARCTIC</span>
        </a>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const foundArchivesNoteEl = document.querySelector('.gallery-item--text .science-text-card-copy');
      if (foundArchivesNoteEl) {
        fetch('/images/AI/FoundArchives/IntroFoundArchives.txt', { cache: 'no-store' })
          .then(function(response) {
            if (!response.ok) return null;
            return response.text();
          })
          .then(function(content) {
            if (typeof content !== 'string') return;
            const trimmed = content.trim();
            if (!trimmed) return;
            foundArchivesNoteEl.textContent = trimmed;
          })
          .catch(function() {
            // Keep fallback text already present in the markup.
          });
      }

      function goHomeWithFade() {
        document.body.classList.add('fade-out');
        setTimeout(function() {
          window.location.href = '/';
        }, 300);
      }

      document.body.addEventListener('click', function(event) {
        const link = event.target.closest('a');
        if (!link) return;

        const href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || link.target === '_blank') return;

        const url = new URL(href, window.location.href);
        if (url.origin !== window.location.origin || url.href === window.location.href) return;

        event.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(function() {
          window.location.href = url.href;
        }, 300);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        e.preventDefault();
        goHomeWithFade();
      });
    });
  </script>

</body>
</html>
