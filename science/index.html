  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const workNoteEl = document.querySelector('.science-text-card-copy');
      if (workNoteEl) {
        fetch('/images/work/WorkNote/IntroWorkNote.txt', { cache: 'no-store' })
          .then(function(response) {
            if (!response.ok) return null;
            return response.text();
          })
          .then(function(content) {
            if (typeof content !== 'string') return;
            const trimmed = content.trim();
            if (!trimmed) return;
            workNoteEl.textContent = trimmed;
          })
          .catch(function() {
            // Keep fallback text already present in the markup.
          });
      }

      function goHomeWithFade() {
        document.body.classList.add('fade-out');
        setTimeout(function() {
          window.location.href = '/';
        }, 300);
      }

      document.body.addEventListener('click', function(event) {
        const link = event.target.closest('a');
        if (!link) return;

        const href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || link.target === '_blank') return;

        const url = new URL(href, window.location.href);
        if (url.origin !== window.location.origin || url.href === window.location.href) return;

        event.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(function() {
          window.location.href = url.href;
        }, 300);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        e.preventDefault();
        goHomeWithFade();
      });
    });
  </script>
