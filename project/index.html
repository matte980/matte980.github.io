<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting | Matteo Monzali</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://matte980.github.io/gallery.html">
<script>
  (function() {
    const target = '../gallery.html' + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
</head>
<body>
  <p>Redirecting to <a id="redirect-link" href="../gallery.html">gallery</a>...</p>
  <script>
    (function() {
      const target = '../gallery.html' + window.location.search + window.location.hash;
      const link = document.getElementById('redirect-link');
      if (link) link.href = target;
    })();
  </script>
</body>
</html>
